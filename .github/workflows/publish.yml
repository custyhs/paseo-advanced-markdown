name: Publish npm package
run-name: ${{ inputs.publish && 'Publish' || 'Validate release' }} ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag (for example v0.4.1)
        required: true
        type: string
      publish:
        description: Publish to npm after validation (leave off for a rehearsal)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  validate:
    if: github.repository == 'custyhs/paseo-advanced-markdown'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      filename: ${{ steps.package.outputs.filename }}
      integrity: ${{ steps.package.outputs.integrity }}
      version: ${{ steps.package.outputs.version }}
    env:
      PASEO_ADVANCED_MARKDOWN_CACHE: ${{ github.workspace }}/.smoke/npm/cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - name: Check release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const { RELEASE_TAG: tag, GITHUB_SHA: sha, GITHUB_REF: ref } = process.env;
          assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.ok(ref === 'refs/heads/main' || ref === `refs/tags/${tag}`, 'Run from main or the selected release tag');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(git('rev-parse', 'HEAD'), sha, 'Build the workflow commit so npm provenance identifies the source');
          const tagSha = git('rev-parse', '--verify', `refs/tags/${tag}^{commit}`);
          git('merge-base', '--is-ancestor', tagSha, sha);
          // An older tag can bootstrap publishing when only CI and developer docs changed.
          // Never checkout a different commit: npm provenance uses the event's GITHUB_SHA.
          const changed = git('diff', '--name-only', '-z', tagSha, sha).split('\0').filter(Boolean);
          assert.deepEqual(changed.filter(file => !file.startsWith('.github/') && !file.startsWith('docs/')), [], 'Release source differs from the tag');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.name, 'paseo-advanced-markdown');
          assert.equal(`v${pkg.version}`, tag);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          const response = await fetch(`https://registry.npmjs.org/${pkg.name}/${pkg.version}`);
          assert.ok(response.status === 200 || response.status === 404, `Registry check failed: ${response.status}`);
          if (process.env.PUBLISH === 'true') assert.equal(response.status, 404, 'This immutable npm version is already published');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Release tag: ${tag} (${tagSha})\n\nBuild/provenance commit: ${sha}\n`);
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - run: npm run prepare-assets
      - run: npm test
      - run: npm run paseo-source
      - run: npm run smoke
      - run: npm run pack
      - run: npm run smoke:package
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Record the validated package
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const packed = JSON.parse(readFileSync('.smoke/npm/pack.json', 'utf8'));
          const version = process.env.RELEASE_TAG.slice(1);
          assert.equal(packed.name, 'paseo-advanced-markdown');
          assert.equal(packed.version, version);
          assert.equal(packed.filename, `paseo-advanced-markdown-${version}.tgz`);
          const file = `.smoke/npm/${packed.filename}`;
          const metadata = JSON.parse(execFileSync('tar', ['-xOf', file, 'package/package.json'], { encoding: 'utf8' }));
          assert.equal(metadata.name, packed.name);
          assert.equal(metadata.version, version);
          assert.notEqual(metadata.private, true);
          assert.ok(metadata.repository === 'github:custyhs/paseo-advanced-markdown' || metadata.repository?.url === 'git+https://github.com/custyhs/paseo-advanced-markdown.git', 'Package repository must match this workflow');
          const integrity = `sha512-${createHash('sha512').update(readFileSync(file)).digest('base64')}`;
          assert.equal(integrity, packed.integrity);
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${packed.filename}\nintegrity=${integrity}\nversion=${version}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nValidated package: ${packed.filename}\n\nIntegrity: ${integrity}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: |
            .smoke/npm/*.tgz
            .smoke/npm/pack.json
            .smoke/npm/source-budget.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  compatibility:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        paseo: ["0.14.0", "0.15.0-beta.1"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm install --prefix .compat-runtime --no-save --package-lock=false --ignore-scripts @getpaseo/server@${{ matrix.paseo }} @getpaseo/plugin@${{ matrix.paseo }}
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: .smoke/npm
      - run: npm run smoke:package
        env:
          PASEO_COMPAT_RUNTIME: .compat-runtime

  publish:
    if: inputs.publish
    needs: [validate, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_FILE: ${{ needs.validate.outputs.filename }}
      PACKAGE_INTEGRITY: ${{ needs.validate.outputs.integrity }}
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - run: npm install --global npm@11.21.1 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: .smoke/npm
      - name: Verify the artifact before publishing
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const { PACKAGE_FILE: file, PACKAGE_INTEGRITY: integrity, PACKAGE_VERSION: version } = process.env;
          assert.equal(file, `paseo-advanced-markdown-${version}.tgz`);
          assert.equal(`sha512-${createHash('sha512').update(readFileSync(`.smoke/npm/${file}`)).digest('base64')}`, integrity);
          const response = await fetch(`https://registry.npmjs.org/paseo-advanced-markdown/${version}`);
          assert.equal(response.status, 404, `Version already published or registry unavailable: ${response.status}`);
          NODE
      - name: Publish with npm Trusted Publishing
        run: npm publish ".smoke/npm/$PACKAGE_FILE" --ignore-scripts --access public --provenance --tag latest
      - name: Verify the published integrity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          const { PACKAGE_VERSION: version, PACKAGE_INTEGRITY: integrity } = process.env;
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(`https://registry.npmjs.org/paseo-advanced-markdown/${version}`);
            if (response.ok) {
              const published = await response.json();
              assert.equal(published.dist.integrity, integrity);
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Published paseo-advanced-markdown@${version}\n\nVerified integrity: ${integrity}\n`);
              break;
            }
            assert.equal(response.status, 404, `Registry verification failed: ${response.status}`);
            assert.ok(attempt < 5, 'Published version did not become readable; check npm before retrying publication');
            await setTimeout(5000);
          }
          NODE
