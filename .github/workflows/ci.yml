name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PASEO_ADVANCED_MARKDOWN_CACHE: ${{ github.workspace }}/.smoke/npm/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - run: npm run prepare-assets
      - run: npm test
      - run: npm run paseo-source
      - run: npm run smoke
      - run: npm run pack
      - run: npm run smoke:package
      - run: npm audit --omit=dev --audit-level=moderate

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        paseo: ["0.14.0", "0.15.0-beta.1"]
    env:
      PASEO_ADVANCED_MARKDOWN_CACHE: ${{ github.workspace }}/.smoke/npm/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Keep the lockfile and 0.13 development baseline intact. Exercise the new
      # compiler, manifest validator and SDK in a separate dependency directory.
      - run: npm install --prefix .compat-runtime --no-save --package-lock=false --ignore-scripts @getpaseo/server@${{ matrix.paseo }} @getpaseo/plugin@${{ matrix.paseo }}
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - run: npm run prepare-assets
      - run: npm run paseo-source
      - run: npm run smoke
        env:
          PASEO_COMPAT_RUNTIME: .compat-runtime
      - run: npm run pack
      - run: npm run smoke:package
        env:
          PASEO_COMPAT_RUNTIME: .compat-runtime
